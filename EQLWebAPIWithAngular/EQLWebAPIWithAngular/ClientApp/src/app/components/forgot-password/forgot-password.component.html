<div class="forgot_password">
  <div class="container-fluid">
    <div class="row align-items-center justify-content-center">
      <div class="col-xg-4 col-lg-4 col-md-6 col-sm-9 col-12 text-center">
          <img src="../../../assets/imgs/logo.png" class="img-fluid logo"/>
        <div class="forgot_password_form">
            <div class="form_header">
                <h1>Reset Password</h1>
              </div>
          <form [formGroup]="form" (ngSubmit)="onSubmit(form.value)">
            <div class="form-group">
              <input [type]="hide? 'password':'text'" class="form-control password" placeholder="Enter Reset Code" formControlName="password" [errorStateMatcher]="matcher">
              <mat-icon matSuffix (click)="hide = !hide">{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
              <!-- <mat-error *ngIf="form.hasError('required', 'password')">Enter Password</mat-error> -->
              <mat-error *ngIf="form.hasError('minLength')">Enter 6 digit code</mat-error>
            </div>
            <div class="form-group">
              <input [type]="hide? 'password':'text'" class="form-control password" placeholder="Enter New Password" formControlName="password" [errorStateMatcher]="matcher">
              <mat-icon matSuffix (click)="hide = !hide">{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
              <!-- <mat-error *ngIf="form.hasError('required', 'password')">Enter Password</mat-error> -->
              <mat-error *ngIf="form.hasError('minLength')">Enter MIN 6 character</mat-error>
            </div>
            <div class="form-group">
              <input [type]="hide? 'password':'text'" class="form-control password" placeholder="Enter Confirm password" formControlName="password" [errorStateMatcher]="matcher">
              <mat-icon matSuffix (click)="hide = !hide">{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
              <!-- <mat-error *ngIf="form.hasError('required', 'password')">Enter Password</mat-error> -->
              <mat-error *ngIf="form.hasError('minLength')">Enter MIN 6 character</mat-error>
            </div>
              <button mat-button class="" [disabled]="!form.valid" routerLink="/">Submit</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
