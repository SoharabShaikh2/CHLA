<div class="login">
  <div class="container-fluid">
    <div class="row align-items-center justify-content-center">
      <div class="col-xg-4 col-lg-4 col-md-6 col-sm-12 col-12 text-center">
          <img src="../../../assets/imgs/logo.png" class="img-fluid logo"/>
        <div class="login_form">
            <div class="form_header">
                <h1>Log In</h1>
              </div>
          <form [formGroup]="form" (ngSubmit)="onSubmit(form.value)">
            <div class="form-group">
              <input type="text" class="form-control user" placeholder="Username" formControlName="email">
            </div>
            <div class="form-group">
                <input [type]="hide? 'password':'text'" class="form-control password" placeholder="Password" formControlName="password" >
                <mat-icon matSuffix (click)="hide = !hide">{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                <!-- <mat-error *ngIf="form.hasError('required', 'password')">Enter Password</mat-error> -->
                <mat-error *ngIf="form.hasError('minLength')">Enter MIN 6 character</mat-error>
              </div>
              <!-- <mat-form-field class="example-full-width">
                  <input matInput placeholder="Enter your password" [type]="hide ? 'password' : 'text'">
                  <mat-icon matSuffix (click)="hide = !hide">{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                </mat-form-field> -->
              <button mat-button class="" [disabled]="!form.valid" (click)="userLogin()">SIGN IN</button>
          </form>
          <a>Forgot Password</a>
        </div>
      </div>
    </div>
  </div>
</div>
